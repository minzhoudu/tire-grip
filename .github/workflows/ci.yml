name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tiregrip
          POSTGRES_PASSWORD: tiregrip
          POSTGRES_DB: tiregrip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tiregrip"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://tiregrip:tiregrip@localhost:5432/tiregrip
      # Test-only secret; production gets its own in Coolify.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Schema straight from src/db/schema.ts + the custom exclusion constraint,
      # then the constraint test suite against a real Postgres.
      - run: pnpm db:push
      - run: pnpm db:constraints
      # re-running must be a no-op
      - run: pnpm db:constraints
      - run: pnpm db:test
      - run: pnpm db:seed
      # Unit tests + integration tests against the Postgres service above
      - run: pnpm test --reporter=default --reporter=json --outputFile=vitest-results.json
      - name: Test summary
        if: always()
        run: |
          node -e '
            const r = require("./vitest-results.json");
            const msg = `${r.numPassedTests} passed, ${r.numFailedTests} failed, ${r.numPendingTests + r.numTodoTests} skipped (${r.numTotalTests} total)`;
            console.log(`::notice title=Vitest::${msg}`);
          '
      - run: pnpm build
